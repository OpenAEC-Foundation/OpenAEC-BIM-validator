services:
  app:
    build: .
    container_name: bim-validator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - CORS_ORIGINS=*
      # Nextcloud cloud storage (opt-in — leave empty to disable)
      - NEXTCLOUD_URL=
      - NEXTCLOUD_SERVICE_USER=
      - NEXTCLOUD_SERVICE_PASS=
    volumes:
      # Persist uploaded files across restarts
      - bim-uploads:/tmp/ifc_uploads
      - bim-processed:/tmp/ifc_processed
      - bim-jobs:/tmp/ids_validation_jobs
    networks:
      - default
      - openaec_platform
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  bim-uploads:
  bim-processed:
  bim-jobs:

networks:
  openaec_platform:
    external: true
