<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC 3D Viewer - That Open Engine POC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #350E35;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        header .subtitle {
            color: #44B6A8;
            font-size: 0.75rem;
        }

        .toolbar {
            background: #f5f5f5;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ddd;
        }

        .toolbar button,
        .toolbar label {
            background: #44B6A8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
        }

        .toolbar button:hover,
        .toolbar label:hover {
            background: #3a9d91;
        }

        .toolbar input[type="file"] {
            display: none;
        }

        #status {
            margin-left: auto;
            color: #666;
            font-size: 0.875rem;
        }

        #container {
            flex: 1;
            position: relative;
            background: #1a1a2e;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            display: none;
        }

        #loading.active {
            display: block;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #44B6A8;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #welcome {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            text-align: center;
        }

        #welcome h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #aaa;
        }

        #welcome p {
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div>
                <h1>IFC 3D Viewer</h1>
                <span class="subtitle">That Open Engine - Research POC</span>
            </div>
        </header>

        <div class="toolbar">
            <label for="file-input">
                Load IFC File
                <input type="file" id="file-input" accept=".ifc">
            </label>
            <button id="fit-btn" disabled>Fit to View</button>
            <button id="reset-btn" disabled>Reset View</button>
            <span id="status">Ready</span>
        </div>

        <div id="container">
            <div id="welcome">
                <h2>Welcome to the IFC Viewer</h2>
                <p>Click "Load IFC File" to get started</p>
            </div>
            <div id="loading">
                <div class="spinner"></div>
                <p>Loading IFC model...</p>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
